# ============================================================================
#  CUSTOM LEVELS
#  Add a [level] block for each custom level. Max 1200 total.
#  Each block appears after the 7 built-in levels in the level select screen.
#
#  Required:  name, terrain_tex
#  Optional:  bg_tex, bg2_tex (midground parallax layer)
#             icon_tex (PNG shown on level select screen preview)
#             amplitude (4.5 = default hilliness - tuned for no slope limiter)
#             frequency (0.14 = default hill spacing)
#             has_bridge (0=no 1=yes), bridge_start_x (150.0)
#
#  Example - uncomment and fill in your paths to add a level:
#
# [level1]
# name            = Arctic Pass
# terrain_tex     = game:\Levels\arctic_terrain.png
# bg_tex          = game:\Backgrounds\arctic_bg.png
# bg2_tex         = game:\Backgrounds\arctic_mid.png
# amplitude       = 4.5
# frequency       = 0.14
# has_bridge      = 1
# bridge_start_x  = 130.0
# icon_tex        = game:\Icons\arctic_icon.png
# music           = game:\Mods\Levels\Volcano\music.wav
# ============================================================================

