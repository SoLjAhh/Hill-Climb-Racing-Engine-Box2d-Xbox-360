# ============================================================================
#  Hill Climb Racing - Xbox 360 Homebrew
#  Settings & Mod Configuration File
#  Location on console: game:\Config\settings.cfg
#
#  THREE kinds of entries are supported:
#
#    KEY = VALUE          Plain float setting (applies globally at startup)
#
#    [car1]                Starts a custom car definition. One block = one car
#                         added to the selection screen. Max 25 custom cars.
#
#    [level1]              Starts a custom level definition. One block = one
#                         level added to the level select screen. Max 25.
#
#  Lines starting with # are comments. Whitespace around = is stripped.
#  All numeric values are floating-point.
#  Changes take effect on the NEXT launch - no recompile needed.
# ============================================================================


# ----------------------------------------------------------------------------
#  GENERAL SETTINGS
# ----------------------------------------------------------------------------

#BARRIER_WALL_X          = 10.0
#FINISH_LINE_X           = 490.0


# ----------------------------------------------------------------------------
#  BRIDGE - POSITION
# ----------------------------------------------------------------------------

BRIDGE_L2_START_X       = 120.0
BRIDGE_L4_START_X       = 200.0


# ----------------------------------------------------------------------------
#  BRIDGE - PHYSICS
#  These values match the current code defaults exactly.
#  The bridge uses 20 short planks connected by revolute joints (free-hinge
#  chain) so it forms a smooth catenary curve under gravity like HCR.
# ----------------------------------------------------------------------------

BRIDGE_SPAN             = 12.0
BRIDGE_PLANK_HEIGHT     = 0.25
BRIDGE_PLANK_DENSITY    = 6.0
BRIDGE_PLANK_FRICTION   = 0.8
BRIDGE_PLANK_RESTITUTION = 0.01

# Anchor height: plank top sits ~0.1 below cliff lip for smooth roll-down entry.
# Do NOT set this positive - that creates an upward step onto the bridge.
BRIDGE_ANCHOR_HEIGHT    = -0.225

# Entry nudge: keep at 0. The 20-plank chain + rotation limits already
# prevent wheel-catching at the bridge entry. A non-zero value here
# would pull the anchors inward and misalign the bridge with the cliff lips.
BRIDGE_ENTRY_NUDGE      = 0.0


# ----------------------------------------------------------------------------
#  BRIDGE - TERRAIN VALLEY
# ----------------------------------------------------------------------------

BRIDGE_VALLEY_DEPTH     = 3.5
BRIDGE_APPROACH_LENGTH  = 4.0
BRIDGE_VALLEY_SLOPE     = 8.0


# ----------------------------------------------------------------------------
#  BRIDGE - VISUAL TUNING
#  Visual height matches physics plank height so what you see = where collision is.
# ----------------------------------------------------------------------------

BRIDGE_VISUAL_WIDTH_SCALE   = 0.5
BRIDGE_VISUAL_HEIGHT_SCALE  = 0.25
BRIDGE_VISUAL_Y_OFFSET      = 0.0


# ============================================================================
#  CUSTOM CARS
#  Add a [car] block for each custom car. Max 1200 total.
#  Each block appears after built-in cars in the selection screen.
#
#  Required:  name, body_tex
#  Optional:  wheel_tex, icon_tex
#             car_width (3.1), car_height (1.25), wheel_radius (0.35)
#             wheel_joint_freq (4.0), wheel_joint_damp (0.8)
#             motor_max_speed (60.0), motor_torque_rear (7.0), motor_torque_front (5.0)
#             ride_height_offset (0.0)
#             wheel_rear_offset_x (-0.96), wheel_front_offset_x (1.0)
#
#  Example - uncomment and fill in your paths to add a car:
#
# [car1]
# name                 = Hot Rod
# body_tex             = game:\Cars\hotrod.png
# wheel_tex            = game:\Tires\hotrod_wheel.png
# icon_tex             = game:\Icons\hotrod_icon.png
# car_width            = 3.4
# car_height           = 1.1
# wheel_radius         = 0.32
# wheel_radius_rear    = 0.45
# wheel_radius_front   = 0.35
# wheel_tex_rear       = game:\Mods\Tires\hotrod_wheel.png
# wheel_tex_front      = game:\Mods\Tires\hotrod_wheel.png
# wheel_joint_freq     = 5.0
# wheel_joint_damp     = 0.85
# motor_max_speed      = 80.0
# sfx_engine           = game:\mods\audio\sfx\engine.wav
# sfx_idle             = game:\mods\audio\sfx\idle.wav
# sfx_reverse          = game:\mods\audio\sfx\reverse.wav
# sfx_horn             = game:\mods\audio\sfx\horn.wav
# motor_torque_rear    = 6.5
# motor_torque_front   = 5.0
# ride_height_offset   = -0.1
# wheel_rear_offset_x  = -0.95
# wheel_front_offset_x = 1.05
# ============================================================================

