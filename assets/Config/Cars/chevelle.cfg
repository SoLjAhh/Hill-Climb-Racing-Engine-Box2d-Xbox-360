# Hill Climb Racer — Chevelle car configuration
# Edit these values to tune the car's physics and visuals.
# Place this file at: game:\Config\Cars\chevelle.cfg
# Any key you remove keeps the built-in hardcoded default.
# ---------------------------------------------------------------
# VISUAL
car_width           = 3.5      # chassis sprite width  (world units)
car_height          = 1.3      # chassis sprite height (world units)
wheel_radius        = 0.3      # wheel sprite radius   (world units)
ride_height_offset  = -0.0     # vertical body offset  (neg = lower)

# SUSPENSION
wheel_joint_freq    = 4.0     # suspension stiffness  (2=soft 8=hard)
wheel_joint_damping = 0.8     # suspension damping    (0=bouncy 1=stiff)

# WHEEL POSITIONS  (relative to chassis centre)
wheel_rear_offset_x  = -0.89   # rear  wheel X  (neg = behind centre)
wheel_front_offset_x = 1.11   # front wheel X  (pos = ahead of centre)

# ENGINE
motor_max_speed     = 75.0     # top wheel angular speed (higher = faster)
motor_torque_rear   = 7.0     # rear  wheel drive force
motor_torque_front  = 5.0     # front wheel drive force (0 = rear-wheel only)
