# Hill Climb Racer — Rally car configuration
# Edit these values to tune the car's physics and visuals.
# Place this file at: game:\Config\Cars\rally.cfg
# Any key you remove keeps the built-in hardcoded default.
# ---------------------------------------------------------------
# VISUAL
car_width           = 3.1      # chassis sprite width  (world units)
car_height          = 1.25      # chassis sprite height (world units)
wheel_radius        = 0.34      # wheel sprite radius   (world units)
ride_height_offset  = 0.0     # vertical body offset  (neg = lower)

# SUSPENSION
wheel_joint_freq    = 4.5     # suspension stiffness  (2=soft 8=hard)
wheel_joint_damping = 0.9     # suspension damping    (0=bouncy 1=stiff)

# WHEEL POSITIONS  (relative to chassis centre)
wheel_rear_offset_x  = -0.96   # rear  wheel X  (neg = behind centre)
wheel_front_offset_x = 1.0   # front wheel X  (pos = ahead of centre)

# ENGINE
motor_max_speed     = 70.0     # top wheel angular speed (higher = faster)
motor_torque_rear   = 6.0     # rear  wheel drive force
motor_torque_front  = 4.5     # front wheel drive force (0 = rear-wheel only)
