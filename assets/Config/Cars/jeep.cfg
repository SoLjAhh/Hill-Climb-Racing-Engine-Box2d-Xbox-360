# Hill Climb Racer — Jeep car configuration
# Edit these values to tune the car's physics and visuals.
# Place this file at: game:\Config\Cars\jeep.cfg
# Any key you remove keeps the built-in hardcoded default.
# ---------------------------------------------------------------
# VISUAL
car_width           = 3.1      # chassis sprite width  (world units)
car_height          = 1.25      # chassis sprite height (world units)
wheel_radius        = 0.35      # wheel sprite radius   (world units)
ride_height_offset  = 0.0     # vertical body offset  (neg = lower)

# Per-wheel radius (omit to use shared wheel_radius)
wheel_radius_rear   = 0.35
wheel_radius_front  = 0.35

# Per-wheel textures (omit to use car's default tire)
wheel_tex_rear      = game:\Tires\tire_standard.png
wheel_tex_front     = game:\Tires\tire_standard.png

# SUSPENSION
wheel_joint_freq    = 4.0     # suspension stiffness  (2=soft 8=hard)
wheel_joint_damping = 0.8     # suspension damping    (0=bouncy 1=stiff)

# WHEEL POSITIONS  (relative to chassis centre)
wheel_rear_offset_x  = -0.96   # rear  wheel X  (neg = behind centre)
wheel_front_offset_x = 1.0   # front wheel X  (pos = ahead of centre)

# ENGINE
motor_max_speed     = 60.0     # top wheel angular speed (higher = faster)
motor_torque_rear   = 7.0     # rear  wheel drive force
motor_torque_front  = 5.0     # front wheel drive force (0 = rear-wheel only)
